server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; return 200 'ok'; }
    location = /downloads/latest.json { add_header Cache-Control "no-store"; try_files $uri =404; }
    location /downloads/ { try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
