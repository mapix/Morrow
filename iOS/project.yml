name: MorrowMobile
configs:
  Debug: debug
  Release: release
  ReleaseCloud: release
options:
  bundleIdPrefix: app.smail
  deploymentTarget:
    iOS: "26.0"
packages:
  Morrow:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MorrowMobile:
    type: application
    platform: iOS
    sources:
      - path: MorrowMobile
        excludes:
          - Resources/Notices
      - path: ../Sources/MorrowApp/ReaderDocument.swift
      - path: ../Sources/MorrowApp/ReaderBodySource.swift
      - path: MorrowMobile/Resources/Notices
        type: folder
        buildPhase: resources
      - path: ../dist/EmbeddingGemma2-Text
        type: folder
        buildPhase: resources
      - path: ../.build-mobile-oauth/oauth-clients.json
        optional: true
        buildPhase: resources
    info:
      path: MorrowMobile/Info.plist
      properties:
        MorrowCloudKitContainer: $(MORROW_CLOUD_CONTAINER)
        CFBundleURLTypes:
          - CFBundleURLName: Morrow Google OAuth
            CFBundleURLSchemes:
              - $(GOOGLE_OAUTH_CALLBACK_SCHEME)
    dependencies:
      - package: Morrow
        product: MorrowCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smail.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GOOGLE_OAUTH_CALLBACK_SCHEME: morrow-google-oauth
        MORROW_CLOUD_CONTAINER: ""
        MORROW_CLOUD_PROFILE_UUID: ""
        MARKETING_VERSION: "0.12.2"
        CURRENT_PROJECT_VERSION: "122"
        INFOPLIST_KEY_CFBundleDisplayName: Morrow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "将你的语音委托转为聊天输入。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "在设备上识别你的语音输入。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "选择截图和图片交给 Morrow 分析。"
      configs:
        ReleaseCloud:
          MORROW_CLOUD_CONTAINER: iCloud.app.smail.workspace
          CODE_SIGN_ENTITLEMENTS: MorrowMobile/MorrowMobile.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE: $(MORROW_CLOUD_PROFILE_UUID)
  MorrowMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MorrowMobileTests
    dependencies:
      - target: MorrowMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MorrowMobile:
    build:
      targets:
        MorrowMobile: all
        MorrowMobileUITests: [test]
    test:
      targets: [MorrowMobileUITests]
  MorrowMobileCloud:
    build:
      targets:
        MorrowMobile: all
    run:
      config: ReleaseCloud
    archive:
      config: ReleaseCloud
